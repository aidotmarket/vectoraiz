name: Native CI
on:
  pull_request:
    branches: [native]
  push:
    branches: [native, 'build/vz-native-*']
permissions:
  contents: read
concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - name: Install protocol compiler
        uses: arduino/setup-protoc@v3
        with:
          version: '29.3'
      - name: Install pipeline example dependencies
        run: python -m pip install numpy==2.2.6 pyarrow==19.0.1 boto3==1.40.45
      - uses: actions/cache@v4
        with:
          path: .assets
          key: assets-${{ runner.os }}-${{ hashFiles('spike/fixtures/models.json', 'scripts/fetch-assets.py') }}
      - name: Fetch verified models and PDFium
        run: python scripts/fetch-assets.py
      - name: Build Apple Vision helper
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/debug
          swiftc scripts/vision-ocr.swift -O -o target/debug/vz-vision-ocr
      - name: Build pinned MinIO
        run: python scripts/minio-test-server.py
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Test branch routing
        run: node scripts/native-guard.mjs --test
      - name: Enforce native PR base
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/native-guard.mjs
      - name: Install UI dependencies
        working-directory: app
        run: npm ci
      - name: UI tests
        working-directory: app
        run: npm test
      - name: Build UI assets
        working-directory: app
        run: npm run build
      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --workspace
      - name: Build pipeline binaries (CPU)
        run: cargo build --locked -p vz-cli -p vz-parser-worker
      - name: Pipeline and MinIO acceptance (CPU)
        env:
          VZ_MINIO_ENDPOINT: local-test-server
        run: python scripts/pipeline-e2e.py
      - name: Self-test
        run: cargo run --locked -p vz-cli --bin vectoraiz-cli -- self-test
      - name: Tauri debug build
        working-directory: app
        run: npm run tauri -- build --debug --no-bundle --features smoke-test
      - name: Launch app and click self-test
        run: python scripts/native-smoke.py
      - name: Install notice generator
        run: cargo install cargo-about --version 0.8.2 --locked
      - name: Generate third-party notices
        run: |
          cargo about generate --locked about.hbs > THIRD_PARTY_NOTICES
          cd app
          npm run --silent licenses >> ../THIRD_PARTY_NOTICES
      - uses: actions/upload-artifact@v4
        with:
          name: THIRD_PARTY_NOTICES-${{ matrix.os }}
          path: THIRD_PARTY_NOTICES
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-evidence-${{ matrix.os }}
          path: |
            minio-test.log
          if-no-files-found: ignore
