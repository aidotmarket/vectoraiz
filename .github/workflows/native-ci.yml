name: Native CI
on:
  pull_request:
    branches: [native]
  push:
    branches: [native, 'build/vz-native-*']
permissions:
  contents: read
concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
      NATIVE_FEATURES: ''
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        # Git Bash prepends /usr/bin, whose link.exe shadows the MSVC linker.
        # Preserve the developer environment's PATH for every Windows Rust step.
        shell: ${{ matrix.os == 'windows-2022' && 'pwsh' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check versions and packaging gates
        run: |
          python scripts/native-version.py
          python scripts/native-build-tests.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - name: Initialize Windows compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install pinned Windows Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-vulkan.ps1
      - name: Install protocol compiler
        run: python scripts/install-protoc.py
      - name: Install pipeline example dependencies
        run: python -m pip install numpy==2.2.6 pyarrow==19.0.1 boto3==1.40.45 paramiko==3.5.1
      - uses: actions/cache@v4
        with:
          path: .assets
          key: assets-${{ runner.os }}-${{ hashFiles('spike/fixtures/models.json', 'scripts/fetch-assets.py') }}
      - name: Fetch verified models and PDFium
        run: python scripts/fetch-assets.py
      - uses: actions/cache/restore@v4
        id: minio-cache
        with:
          path: ${{ runner.os == 'Windows' && '.tools/minio.exe' || '.tools/minio' }}
          key: minio-${{ runner.os }}-${{ runner.arch }}-go1.24.2-${{ hashFiles('scripts/minio-test-server.py') }}
      - name: Build pinned MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: python scripts/minio-test-server.py
      - uses: actions/cache/save@v4
        if: steps.minio-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.os == 'Windows' && '.tools/minio.exe' || '.tools/minio' }}
          key: ${{ steps.minio-cache.outputs.cache-primary-key }}
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Test branch routing
        run: node scripts/native-guard.mjs --test
      - name: Enforce native PR base
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/native-guard.mjs
      - name: Install UI dependencies
        working-directory: app
        run: npm ci
      - name: UI tests
        working-directory: app
        run: npm test
      - name: Build UI assets
        working-directory: app
        run: npm run build
      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --locked --all-targets ${{ env.NATIVE_FEATURES }} -- -D warnings
      # Restore the Rust cache before placing the non-Cargo OCR helper beside workers.
      - name: Build Apple Vision helper
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/debug
          swiftc scripts/vision-ocr.swift -O -o target/debug/vz-vision-ocr
      - name: Rust tests
        timeout-minutes: 20
        run: python scripts/rust-tests.py ${{ env.NATIVE_FEATURES }}
      - name: Build CLI workers and Tauri debug app
        run: cargo build --locked --workspace --features vectoraiz/smoke-test,vectoraiz/custom-protocol ${{ env.NATIVE_FEATURES }}
      - name: Pipeline and MinIO acceptance (CPU)
        env:
          VZ_MINIO_ENDPOINT: local-test-server
        run: python scripts/pipeline-e2e.py
      - name: Self-test
        run: ./target/debug/vectoraiz-cli self-test
      - name: Launch app and exercise pipeline IPC
        run: python scripts/native-smoke.py
      - name: Install notice generator
        run: cargo install cargo-about --version 0.8.2 --locked
      - name: Generate third-party notices
        run: |
          python scripts/native-generate-notices.py
      # Workspace acceptance enables Vulkan, but the stage 1 desktop is built
      # without it. Sidecars must likewise run on a fresh machine without the SDK.
      - name: Build standalone CPU sidecars for Windows installer
        if: runner.os == 'Windows'
        run: cargo build --locked -p vz-parser-worker -p vz-cli -p vz-mcp
      - name: Prepare stage 1 bundle inputs
        run: python scripts/native-package.py prepare
      # Phase 0 intentionally packages the tested debug profile, with smoke-test
      # support for first-run UI acceptance. Production optimization is a later gate.
      - name: Package ad-hoc macOS app (no updater signing key)
        if: runner.os == 'macOS'
        working-directory: app
        run: npm run tauri -- build --debug --ci --features smoke-test,custom-protocol --bundles app --config src-tauri/gen/stage1.conf.json
      - name: Package unsigned per-machine Windows MSI
        if: runner.os == 'Windows'
        working-directory: app
        run: npm run tauri -- build --debug --ci --features smoke-test,custom-protocol --bundles msi --config src-tauri/gen/stage1.conf.json
      - name: Collect installers and unsigned update archives
        run: python scripts/native-package.py collect
      - uses: actions/upload-artifact@v4
        with:
          name: native-installers-${{ matrix.os }}
          path: target/stage1/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: THIRD_PARTY_NOTICES-${{ matrix.os }}
          path: THIRD_PARTY_NOTICES
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-evidence-${{ matrix.os }}
          path: |
            minio-test.log
            windows-test-dependents.log
          if-no-files-found: ignore
  install:
    timeout-minutes: 40
    name: Install/uninstall stand-in (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: native-installers-${{ matrix.os }}
          path: artifacts
      - name: Install downloaded artifact, first-run model acquisition and pipeline, uninstall preserving data
        timeout-minutes: 35
        run: python scripts/native-install-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-app-evidence-${{ matrix.os }}
          path: |
            installed-ui.log
            installed-self-test.json
            installed-pipeline.log
            installed-loaded-models.json
            installed-single-instance.json
            msi-install.log
            msi-uninstall.log
          if-no-files-found: warn
  ui-test-macos:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install protocol compiler
        run: python scripts/install-protoc.py
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Prove release and stage-1 exclude UI test features
        run: python scripts/native-ui-test-gate.py
      - name: Install UI dependencies
        working-directory: app
        run: npm ci
      - name: Build debug UI test app (no model assets)
        working-directory: app
        run: npm run tauri -- build --debug --ci --features ui-test,custom-protocol --bundles app --config src-tauri/ui-test/tauri.conf.json
      - name: Lint UI test Rust code
        run: cargo clippy --locked -p vectoraiz --all-targets --features ui-test,custom-protocol -- -D warnings
      - name: Native first-run UI smoke
        working-directory: app
        run: npx wdio run wdio.conf.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-macos-failure
          path: app/ui-test-results/
          if-no-files-found: warn
          retention-days: 14
