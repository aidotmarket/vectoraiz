name: Delivered Office validation
on:
  workflow_dispatch:
  push:
    branches: ['build/office-delivered-validation-*']
    paths:
      - 'tests/office/delivered/**'
      - 'tools/office-validate/**'
      - '.github/workflows/office-delivered-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.428'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Fetch hash-verified POI bootstrap originals
        run: python tools/office-validate/fetch-sanity.py tests/office/delivered/_poi-sanity
      - name: Build pinned Open XML SDK validator
        run: dotnet build tools/office-validate/OfficeValidate.csproj --configuration Release -p:RestoreLockedMode=true
      - name: Install pinned PDF reader
        if: ${{ always() }}
        run: python -m pip install -r tools/office-validate/requirements.txt
      - name: Test report failure handling
        run: python -m unittest discover -s tools/office-validate -p 'test_*.py' -v
      - name: Install pinned LibreOffice
        if: ${{ always() }}
        run: |
          choco install libreoffice-fresh --version=26.2.6 --yes --no-progress --limit-output --force --allow-downgrade
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) { throw "LibreOffice install failed: $LASTEXITCODE" }
          exit 0
      - name: Validate schemas and render every input, preserving failures
        if: ${{ always() }}
        run: >-
          python tools/office-validate/run-validation.py tests/office/delivered
          --sdk-dll tools/office-validate/bin/Release/net8.0/OfficeValidate.dll
          --soffice "C:/Program Files/LibreOffice/program/soffice.com"
          --report "${{ runner.temp }}/office-delivered-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: office-delivered-validation
          path: ${{ runner.temp }}/office-delivered-validation.json
          if-no-files-found: error
          retention-days: 14
