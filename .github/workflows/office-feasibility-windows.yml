name: Office C1 Windows feasibility (unqualified)

on:
  push:
    branches: [build/office-web-c1-feasibility-s1927]
    paths:
      - '.github/workflows/office-feasibility-windows.yml'
      - 'crates/vz-office-windows-harness/**'
      - 'crates/vz-parser-worker/**'
      - 'scripts/office-windows-feasibility.py'
      - 'scripts/fetch-assets.py'
      - 'tests/office/windows/**'
      - 'tests/office/fixtures/windows_synthetic.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-c1-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  feasibility:
    runs-on: windows-2022
    timeout-minutes: 65
    defaults:
      run:
        # Same MSVC PATH rule as native-ci.yml: do not use Git Bash's link.exe.
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set evidence directory
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "office-c1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "OFFICE_EVIDENCE_DIR=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Initialize complete all-unrun manifest before build
        run: |
          python scripts/office-windows-feasibility.py --initialize-only --out $env:OFFICE_EVIDENCE_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/office-windows-feasibility.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Toolchain steps follow native-ci.yml. OCR and model acquisition are omitted.
      - name: Initialize Windows compiler environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Install pinned Windows Vulkan SDK
        run: |
          pwsh -NoProfile -File scripts/install-vulkan.ps1 *> "$env:OFFICE_EVIDENCE_DIR/vulkan-setup.log"
          $code = $LASTEXITCODE
          Get-Content "$env:OFFICE_EVIDENCE_DIR/vulkan-setup.log" -Tail 40
          exit $code
      - name: Install protocol compiler
        run: |
          python scripts/install-protoc.py *> "$env:OFFICE_EVIDENCE_DIR/protoc-setup.log"
          $code = $LASTEXITCODE
          Get-Content "$env:OFFICE_EVIDENCE_DIR/protoc-setup.log" -Tail 40
          exit $code
      - name: Install pinned Rust
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          cache-on-failure: true
          shared-key: office-c1-windows
      - name: Regenerate restored llama CMake projects
        run: |
          python scripts/native-cmake-cache.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch verified PDFium only (no models or OCR assets)
        run: |
          python scripts/office-windows-feasibility.py --fetch-pdfium "$env:OFFICE_EVIDENCE_DIR/assets" *> "$env:OFFICE_EVIDENCE_DIR/pdfium-setup.log"
          $code = $LASTEXITCODE
          Get-Content "$env:OFFICE_EVIDENCE_DIR/pdfium-setup.log" -Tail 40
          exit $code
      - name: Format and lint the Windows harness
        run: |
          cargo fmt --all --check *> "$env:OFFICE_EVIDENCE_DIR/format.log"
          $code = $LASTEXITCODE
          Get-Content "$env:OFFICE_EVIDENCE_DIR/format.log" -Tail 60
          if ($code -ne 0) { exit $code }
          cargo clippy --locked -p vz-office-windows-harness --all-targets --features office-feasibility -- -D warnings *> "$env:OFFICE_EVIDENCE_DIR/clippy.log"
          $code = $LASTEXITCODE
          Get-Content "$env:OFFICE_EVIDENCE_DIR/clippy.log" -Tail 60
          exit $code
      - name: Verify suspended LPAC and ordinary AppContainer token checks
        run: |
          cargo test --locked -p vz-office-windows-harness --features office-feasibility -- --nocapture *> "$env:OFFICE_EVIDENCE_DIR/token-tests.log"
          $code = $LASTEXITCODE
          Get-Content "$env:OFFICE_EVIDENCE_DIR/token-tests.log" -Tail 80
          exit $code
      - name: Build actual opt-in parser worker and suspended launcher
        run: |
          cargo build --locked -p vz-parser-worker -p vz-office-windows-harness --features office-feasibility --bin vz-parser-worker --bin vz-office-windows-launch *> "$env:OFFICE_EVIDENCE_DIR/build.log"
          $code = $LASTEXITCODE
          Get-Content "$env:OFFICE_EVIDENCE_DIR/build.log" -Tail 80
          exit $code
      - name: Run suspended launch diagnostic first, then all fold 10 probes
        timeout-minutes: 15
        run: |
          python scripts/office-windows-feasibility.py --out "$env:OFFICE_EVIDENCE_DIR/run" --pdfium "$env:OFFICE_EVIDENCE_DIR/assets/pdfium.dll" *> "$env:OFFICE_EVIDENCE_DIR/suite.log"
          $code = $LASTEXITCODE
          Get-Content "$env:OFFICE_EVIDENCE_DIR/suite.log" -Tail 110
          exit $code
      - name: Retain and validate redacted manifest even on failure
        id: validate_manifest
        if: always()
        run: |
          $partial = "$env:OFFICE_EVIDENCE_DIR/run/manifest.json"
          if (Test-Path $partial) {
            Copy-Item $partial "$env:OFFICE_EVIDENCE_DIR/manifest.json" -Force
          }
          python scripts/office-windows-feasibility.py --validate-manifest "$env:OFFICE_EVIDENCE_DIR/manifest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.validate_manifest.outcome == 'success'
        with:
          name: office-c1-windows-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          # Raw requests, paths, fixture bytes and full logs remain private.
          path: ${{ env.OFFICE_EVIDENCE_DIR }}/manifest.json
          if-no-files-found: error
          retention-days: 7
