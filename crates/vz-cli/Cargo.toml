[package]
name = "vz-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vectoraiz-cli"
path = "src/main.rs"

[dependencies]
vz-core.workspace = true
serde_json.workspace = true
vz-pack = { path = "../vz-pack" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

[features]
vulkan = ["vz-core/vulkan"]

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread"]
