[package]
name = "vz-office-windows-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
office-feasibility = []

[dependencies]
anyhow = "1"
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_Networking_WinSock", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_System_RemoteDesktop"] }

[[bin]]
name = "vz-office-windows-launch"
path = "src/main.rs"
required-features = ["office-feasibility"]
