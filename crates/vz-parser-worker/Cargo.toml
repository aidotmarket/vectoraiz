[package]
name = "vz-parser-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vz-core.workspace = true
serde_json.workspace = true
pdfium-render = { version = "=0.8.35", default-features = false, features = ["pdfium_7350", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"

[features]
office-feasibility = ["vz-core/office-feasibility", "dep:vz-office-windows-harness", "vz-office-windows-harness/office-feasibility"]

[target.'cfg(windows)'.dependencies]
vz-office-windows-harness = { path = "../vz-office-windows-harness", optional = true }

[[bin]]
name = "vz-office-worker"
path = "src/office.rs"
required-features = ["office-feasibility"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "vz-worker-test-probe"
path = "tests/support/probe.rs"
