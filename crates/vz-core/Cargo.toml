[package]
name = "vz-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
calamine = "0.30"
scraper = "0.24"
pdfium-render = { version = "=0.8.35", default-features = false, features = ["pdfium_7350", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
llama-cpp-2 = { version = "=0.1.138", default-features = false }
llama-cpp-sys-2 = { version = "=0.1.138", default-features = false }
encoding_rs = "0.8"
lancedb = { version = "=0.22.2", default-features = false }
lance-index = "=0.38.2"
arrow-array = "56.2"
arrow-schema = "56.2"
arrow-select = "56.2"
parquet = { version = "56.2", default-features = false, features = ["arrow", "snap"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.138", default-features = false, features = ["metal"] }

[features]
vulkan = ["llama-cpp-2/vulkan"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_Security", "Win32_Foundation", "Win32_System_Threading"] }
