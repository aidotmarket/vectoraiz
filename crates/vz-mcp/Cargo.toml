[package]
name = "vz-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vectoraiz-mcp"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "io-std"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
