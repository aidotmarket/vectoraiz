[package]
name = "vectoraiz"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
smoke-test = []
ui-test = ["dep:tauri-plugin-wdio-webdriver"]
custom-protocol = ["tauri/custom-protocol"]
vulkan = ["vz-core/vulkan"]

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3"
tauri-plugin-opener = "=2.7.2"
zip = { version = "2", default-features = false }
tauri = { version = "2", features = [] }
vz-core.workspace = true
vz-pack = { path = "../../crates/vz-pack" }

serde_json.workspace = true
serde.workspace = true
vz-mcp = { path = "../../crates/vz-mcp" }
tokio-util = { version = "0.7", features = ["rt"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
getrandom = "=0.3.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
tauri-plugin-updater = "2.14.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "system-proxy"] }
tauri-plugin-single-instance = "=2.4.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
vz-core = { workspace = true, features = ["test-support"] }
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os="macos")'.dependencies]
core-foundation-sys = "=0.8.7"
