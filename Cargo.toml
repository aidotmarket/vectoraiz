[workspace]
members = ["crates/*", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.0.11"
edition = "2021"
license = "Elastic-2.0"
rust-version = "1.90"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vz-core = { path = "crates/vz-core" }

# llama-cpp-sys-2 0.1.138 builds native C++ in Release, but its build script
# adds msvcrtd when cfg(debug_assertions) is set. Mixing that debug heap with
# Release CRT allocations triggers a modal _free_dbg assertion before libtest.
# Keep the binding build script aligned with its native Release runtime; the
# test profile inherits this package override. Workspace test assertions remain on.
[profile.dev.package.llama-cpp-sys-2]
debug-assertions = false
